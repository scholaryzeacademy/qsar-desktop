name: Build Windows installer

# PyInstaller doesn't cross-compile, so the .exe can only be produced by an
# actual Windows build — this runs the whole BUILD_WINDOWS.md flow on a
# GitHub-hosted windows-latest runner and hands back an installer, so a
# real Windows machine is never required to produce one. See
# BUILD_WINDOWS.md for the equivalent manual steps and what to do if a
# rebuild here reports a missing module.
#
# Requires one repo Actions **variable** (Settings > Secrets and variables
# > Actions > Variables), not a secret — it's just a public HTTPS URL, the
# installed app never holds AWS credentials (see backend/downloads.py):
#   DOWNLOAD_BASE_URL = https://<your-bucket-or-cdn>

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # needed for softprops/action-gh-release below to create/attach to a release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies (CPU-only torch first)
        # shell: bash (not the Windows default, pwsh) so this actually
        # stops on the FIRST failing command — pwsh only fails a
        # multi-line run block on its LAST command's exit code, so an
        # earlier `pip install` failing here (as pywebview==5.5 briefly
        # did — a version that never existed on PyPI) got silently
        # skipped, PyInstaller then "succeeded" bundling almost nothing,
        # and the whole build looked green. bash's default -e wrapper
        # (GitHub Actions always adds -eo pipefail for shell: bash)
        # makes that class of failure impossible to miss again.
        shell: bash
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build frontend
        working-directory: frontend
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: PyInstaller (see BUILD_WINDOWS.md for what each flag is for)
        run: >
          pyinstaller --noconfirm --windowed --name PhytoScreen
          --paths backend
          --add-data "frontend/dist;frontend/dist"
          --add-data "docking_registry.json;."
          --add-data "panel_results_v2.csv;."
          --add-data "models/curated;models/curated"
          --add-data "bin;bin"
          --collect-all rdkit
          --collect-all autogluon
          --collect-all chemprop
          --collect-all lightning
          --collect-all posebusters
          --collect-all meeko
          --collect-all gemmi
          --collect-all webview
          --collect-all admet_ai
          --collect-all cuik_molmaker
          --collect-all openmm
          --collect-all pdbfixer
          --hidden-import lightgbm
          --hidden-import catboost
          --hidden-import xgboost
          --hidden-import uvicorn
          desktop.py

      - name: Sanity-check the bundle isn't near-empty
        # A real onedir bundle with torch+rdkit+autogluon+chemprop is
        # solidly in the hundreds-of-MB-to-multi-GB range. 200MB is a
        # conservative floor no real build should ever be near, but a
        # broken one (e.g. a dependency silently failed to install, so
        # PyInstaller only bundled the stdlib + desktop.py) lands at
        # ~10MB — this is what would have caught that exact failure
        # immediately instead of shipping a fake installer.
        shell: bash
        run: |
          size_bytes=$(du -sb dist/PhytoScreen | cut -f1)
          size_mb=$((size_bytes / 1024 / 1024))
          echo "dist/PhytoScreen is ${size_mb} MB"
          if [ "$size_mb" -lt 200 ]; then
            echo "::error::dist/PhytoScreen is only ${size_mb} MB — a real build with torch/rdkit/autogluon/chemprop should be hundreds of MB+. A dependency likely failed to install silently. Check the 'Install backend dependencies' and 'PyInstaller' step logs above for ERROR lines."
            exit 1
          fi

          # models/curated/ is bundled directly (--add-data), not
          # downloaded — a real shipped bug: fresh/on-demand decoy
          # generation silently built an empty pool without it. Confirm
          # the actual CSVs landed in the bundle, not just that
          # --add-data didn't error (it wouldn't, even for zero files).
          curated_count=$(find dist/PhytoScreen -path "*/models/curated/*.csv" | wc -l)
          echo "Bundled models/curated/ CSVs: ${curated_count}"
          if [ "$curated_count" -lt 1 ]; then
            echo "::error::No models/curated/*.csv files found in the bundle — fresh decoy generation's compound pool will be empty. Check the --add-data \"models/curated;models/curated\" entry and that models/curated/ exists in the checkout."
            exit 1
          fi

      - name: Verify the built exe actually WORKS (not just starts)
        # A previous round of this shipped a build that started cleanly
        # (backend imported, /api/health served fine) but crashed the
        # instant anyone actually ran a real prediction — chemprop's
        # featurizer needs cuik_molmaker's native library + data files,
        # which plain import analysis never bundles (see BUILD_WINDOWS.md's
        # "Why --collect-all cuik_molmaker"). A healthy backend and a
        # working prediction are different guarantees; this step checks
        # both, plus the ADMET-AI worker and every bundled read-only data
        # file (docking_registry.json, panel_results_v2.csv — another
        # real shipped bug: both silently loaded empty in a frozen onedir
        # build), by driving the exact same flow a real user does:
        # download a real (small, ~10MB) target from the live bucket,
        # predict against it, profile with ADMET, and confirm diseases/
        # docking targets both come back non-empty.
        # --windowed has no console to report failures through, so
        # desktop.py always writes to a log file
        # (%LOCALAPPDATA%\PhytoScreen\desktop.log) — read it for both the
        # startup port and any crash diagnostics.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $logPath = Join-Path $env:LOCALAPPDATA "PhytoScreen\desktop.log"
          if (Test-Path $logPath) { Remove-Item $logPath -Force }
          $proc = Start-Process -FilePath "dist\PhytoScreen\PhytoScreen.exe" -PassThru
          $port = $null
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            if (Test-Path $logPath) {
              $content = Get-Content $logPath -Raw
              if ($content -match "backend built OK, starting uvicorn on port (\d+)") { $port = $Matches[1] }
              if ($content -match "backend is up, serving") { break }
              if ($content -match "FATAL") { break }
            }
          }
          function Fail($msg) {
            Write-Host "--- desktop.log ---"
            if (Test-Path $logPath) { Get-Content $logPath } else { Write-Host "(never created)" }
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Write-Error $msg
            exit 1
          }
          if (-not $port) { Fail "Backend never reported its port within 60s — see the log above." }
          $base = "http://127.0.0.1:$port"

          # The app's own log already proves the backend answered ITS OWN
          # internal health probe (that's what "backend is up, serving"
          # above means — see _wait_up() in desktop.py) — a few retries
          # here absorb a slow first external connection (seen once: cold
          # process, CI runner contention) without masking a real failure,
          # since a genuinely dead backend would fail all 5 attempts too.
          $healthOk = $false
          for ($i = 0; $i -lt 5; $i++) {
            try { Invoke-RestMethod "$base/api/health" -TimeoutSec 10 | Out-Null; $healthOk = $true; break }
            catch { Start-Sleep -Seconds 2 }
          }
          if (-not $healthOk) { Fail "GET /api/health failed after 5 attempts." }

          # Download a real, small target from the live bucket — exercises
          # the exact download->extract->load pipeline a real user hits.
          try {
            $job = Invoke-RestMethod -Method Post "$base/api/downloads/target/CHEMBL1951_MAOA?kind=model" -TimeoutSec 15
          } catch { Fail "POST /api/downloads/target failed: $_" }
          if ($job.job_id) {
            $done = $false
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Seconds 1
              $p = Invoke-RestMethod "$base/api/downloads/progress/$($job.job_id)" -TimeoutSec 10
              if ($p.state -eq "done") { $done = $true; break }
              if ($p.state -eq "error") { Fail "Model download failed: $($p.error)" }
            }
            if (-not $done) { Fail "Model download never finished within 90s." }
          }

          # The actual bug this step exists to catch: a real prediction.
          try {
            $pred = Invoke-RestMethod -Method Post "$base/api/predict" -TimeoutSec 60 `
              -ContentType "application/json" -Body '{"target_id":"CHEMBL1951_MAOA","smiles":["CCO"]}'
          } catch { Fail "POST /api/predict threw: $_" }
          if (-not $pred.in_domain -or $pred.in_domain.Count -eq 0 -or $null -eq $pred.in_domain[0].predicted_pIC50) {
            Fail "predict() ran but returned no usable prediction: $($pred | ConvertTo-Json -Depth 5)"
          }
          Write-Host "Predict OK: pIC50=$($pred.in_domain[0].predicted_pIC50)"

          # ADMET-AI worker: same chemprop/cuik_molmaker dependency, started
          # automatically by desktop.py (see start_admet_worker()) — confirm
          # its learned layer, not just the always-on deterministic one.
          try {
            $admet = Invoke-RestMethod -Method Post "$base/api/admet" -TimeoutSec 30 `
              -ContentType "application/json" -Body '{"target_id":"_","smiles":["CCO"]}'
          } catch { Fail "POST /api/admet threw: $_" }
          $learned = $admet.profiles[0].learned
          if (-not $learned.available) {
            Fail "ADMET-AI worker's learned layer is unavailable: $($learned.note)"
          }
          Write-Host "ADMET-AI worker OK: learned layer available."

          # Bundled read-only data files (docking_registry.json,
          # panel_results_v2.csv) — a real, previously-shipped bug: both
          # loaded as empty/None in a frozen onedir build (PyInstaller's
          # _internal/ layout vs. desktop.py's cwd — see BUILD_WINDOWS.md),
          # silently (no exception), so disease search and every target's
          # validated badge just showed nothing. Predict/ADMET working
          # doesn't exercise either file, so this needs its own check.
          try { $diseases = Invoke-RestMethod "$base/api/diseases" -TimeoutSec 10 }
          catch { Fail "GET /api/diseases threw: $_" }
          if (-not $diseases.diseases -or $diseases.diseases.Count -eq 0) {
            Fail "GET /api/diseases returned zero diseases — panel_results_v2.csv likely isn't resolving in this frozen build."
          }
          Write-Host "Diseases OK: $($diseases.diseases.Count) diseases."

          try { $dockStatus = Invoke-RestMethod "$base/api/docking/status" -TimeoutSec 10 }
          catch { Fail "GET /api/docking/status threw: $_" }
          if (-not $dockStatus.target_details -or $dockStatus.target_details.Count -eq 0) {
            Fail "GET /api/docking/status returned zero target_details — docking_registry.json likely isn't resolving in this frozen build."
          }
          Write-Host "Docking registry OK: $($dockStatus.target_details.Count) targets."

          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Host "Full end-to-end verification passed: startup, real predict, ADMET-AI, diseases, and docking registry all OK."

      - name: Fill in DOWNLOAD_BASE_URL for the launcher
        # backend/downloads.py already bakes in the project's real R2
        # bucket as its own default, so this repo variable only exists to
        # let a fork/different build point at a DIFFERENT bucket without
        # a code change. If it's unset, drop the `set DOWNLOAD_BASE_URL=`
        # line entirely (not "set it to empty") — an explicitly-empty env
        # var would override that code-level default with "", which is
        # not the same as leaving it unset. See installer/PhytoScreen.bat.
        shell: pwsh
        env:
          DOWNLOAD_BASE_URL: ${{ vars.DOWNLOAD_BASE_URL }}
        run: |
          # Get-Content and Set-Content on the SAME file in one pipeline
          # deadlocks on Windows (Get-Content still holds a read handle
          # when Set-Content opens it for writing) — materialize into a
          # variable first so the read is fully done before the write starts.
          if ($env:DOWNLOAD_BASE_URL) {
            $lines = (Get-Content installer/PhytoScreen.bat) -replace '__DOWNLOAD_BASE_URL__', $env:DOWNLOAD_BASE_URL
          } else {
            Write-Host "DOWNLOAD_BASE_URL repo variable is unset — using backend/downloads.py's built-in default bucket."
            $lines = Get-Content installer/PhytoScreen.bat | Where-Object { $_ -notmatch '__DOWNLOAD_BASE_URL__' }
          }
          Set-Content installer/PhytoScreen.bat -Value $lines

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=${{ steps.ver.outputs.version }} `
            installer\phytoscreen.iss

      - uses: actions/upload-artifact@v4
        with:
          name: PhytoScreenSetup
          path: installer/dist_installer/PhytoScreenSetup.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/dist_installer/PhytoScreenSetup.exe
