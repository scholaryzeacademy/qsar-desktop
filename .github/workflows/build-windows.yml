name: Build Windows installer

# PyInstaller doesn't cross-compile, so the .exe can only be produced by an
# actual Windows build — this runs the whole BUILD_WINDOWS.md flow on a
# GitHub-hosted windows-latest runner and hands back an installer, so a
# real Windows machine is never required to produce one. See
# BUILD_WINDOWS.md for the equivalent manual steps and what to do if a
# rebuild here reports a missing module.
#
# Requires one repo Actions **variable** (Settings > Secrets and variables
# > Actions > Variables), not a secret — it's just a public HTTPS URL, the
# installed app never holds AWS credentials (see backend/downloads.py):
#   DOWNLOAD_BASE_URL = https://<your-bucket-or-cdn>

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # needed for softprops/action-gh-release below to create/attach to a release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies (CPU-only torch first)
        # shell: bash (not the Windows default, pwsh) so this actually
        # stops on the FIRST failing command — pwsh only fails a
        # multi-line run block on its LAST command's exit code, so an
        # earlier `pip install` failing here (as pywebview==5.5 briefly
        # did — a version that never existed on PyPI) got silently
        # skipped, PyInstaller then "succeeded" bundling almost nothing,
        # and the whole build looked green. bash's default -e wrapper
        # (GitHub Actions always adds -eo pipefail for shell: bash)
        # makes that class of failure impossible to miss again.
        shell: bash
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build frontend
        working-directory: frontend
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: PyInstaller (see BUILD_WINDOWS.md for what each flag is for)
        run: >
          pyinstaller --noconfirm --windowed --name PhytoScreen
          --paths backend
          --add-data "frontend/dist;frontend/dist"
          --add-data "docking_registry.json;."
          --add-data "bin;bin"
          --collect-all rdkit
          --collect-all autogluon
          --collect-all chemprop
          --collect-all lightning
          --collect-all posebusters
          --collect-all meeko
          --collect-all gemmi
          --collect-all webview
          --hidden-import lightgbm
          --hidden-import catboost
          --hidden-import xgboost
          --hidden-import uvicorn
          desktop.py

      - name: Sanity-check the bundle isn't near-empty
        # A real onedir bundle with torch+rdkit+autogluon+chemprop is
        # solidly in the hundreds-of-MB-to-multi-GB range. 200MB is a
        # conservative floor no real build should ever be near, but a
        # broken one (e.g. a dependency silently failed to install, so
        # PyInstaller only bundled the stdlib + desktop.py) lands at
        # ~10MB — this is what would have caught that exact failure
        # immediately instead of shipping a fake installer.
        shell: bash
        run: |
          size_bytes=$(du -sb dist/PhytoScreen | cut -f1)
          size_mb=$((size_bytes / 1024 / 1024))
          echo "dist/PhytoScreen is ${size_mb} MB"
          if [ "$size_mb" -lt 200 ]; then
            echo "::error::dist/PhytoScreen is only ${size_mb} MB — a real build with torch/rdkit/autogluon/chemprop should be hundreds of MB+. A dependency likely failed to install silently. Check the 'Install backend dependencies' and 'PyInstaller' step logs above for ERROR lines."
            exit 1
          fi

      - name: Verify the built exe actually starts the backend
        # A correctly-SIZED bundle can still be functionally broken (this
        # shipped once: backend/app.py's whole import tree was silently
        # missing because PyInstaller couldn't see desktop.py's runtime
        # sys.path trick — see BUILD_WINDOWS.md's "Why --paths backend").
        # --windowed means the app has no console to report that kind of
        # failure through, so desktop.py always writes to a log file
        # (%LOCALAPPDATA%\PhytoScreen\desktop.log) — actually launch the
        # frozen exe here and wait for its "backend is up, serving" line,
        # not just the PyInstaller build log, before this is ever allowed
        # to become a release. Doesn't need pywebview's native window to
        # succeed (that needs a real display and isn't what this checks)
        # — only that the FastAPI backend itself came up correctly.
        shell: pwsh
        run: |
          $logPath = Join-Path $env:LOCALAPPDATA "PhytoScreen\desktop.log"
          if (Test-Path $logPath) { Remove-Item $logPath -Force }
          $proc = Start-Process -FilePath "dist\PhytoScreen\PhytoScreen.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            if (Test-Path $logPath) {
              $content = Get-Content $logPath -Raw
              if ($content -match "backend is up, serving") { $ok = $true; break }
              if ($content -match "FATAL") { break }
            }
          }
          if (Test-Path $logPath) {
            Write-Host "--- desktop.log ---"
            Get-Content $logPath
          } else {
            Write-Host "desktop.log was never created."
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) {
            Write-Error "The built exe's backend never reported 'up, serving' within 60s — see the log above for the actual cause."
            exit 1
          }
          Write-Host "Backend startup verified OK."

      - name: Fill in DOWNLOAD_BASE_URL for the launcher
        # backend/downloads.py already bakes in the project's real R2
        # bucket as its own default, so this repo variable only exists to
        # let a fork/different build point at a DIFFERENT bucket without
        # a code change. If it's unset, drop the `set DOWNLOAD_BASE_URL=`
        # line entirely (not "set it to empty") — an explicitly-empty env
        # var would override that code-level default with "", which is
        # not the same as leaving it unset. See installer/PhytoScreen.bat.
        shell: pwsh
        env:
          DOWNLOAD_BASE_URL: ${{ vars.DOWNLOAD_BASE_URL }}
        run: |
          # Get-Content and Set-Content on the SAME file in one pipeline
          # deadlocks on Windows (Get-Content still holds a read handle
          # when Set-Content opens it for writing) — materialize into a
          # variable first so the read is fully done before the write starts.
          if ($env:DOWNLOAD_BASE_URL) {
            $lines = (Get-Content installer/PhytoScreen.bat) -replace '__DOWNLOAD_BASE_URL__', $env:DOWNLOAD_BASE_URL
          } else {
            Write-Host "DOWNLOAD_BASE_URL repo variable is unset — using backend/downloads.py's built-in default bucket."
            $lines = Get-Content installer/PhytoScreen.bat | Where-Object { $_ -notmatch '__DOWNLOAD_BASE_URL__' }
          }
          Set-Content installer/PhytoScreen.bat -Value $lines

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=${{ steps.ver.outputs.version }} `
            installer\phytoscreen.iss

      - uses: actions/upload-artifact@v4
        with:
          name: PhytoScreenSetup
          path: installer/dist_installer/PhytoScreenSetup.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/dist_installer/PhytoScreenSetup.exe
